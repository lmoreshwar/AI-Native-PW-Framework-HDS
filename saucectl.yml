    params:
      browserName: chrome
      project: desktop-chrome
      headless: false
      grep: 'User adds a filtered case to the watch list and verifies the confirmation and Unwatch state @P1 @Regression'

reporters:
  # Prints a console summary of failed/interesting jobs after the run.
  spotlight:
    enabled: true
  # Combine every job's results into ONE JUnit file locally. This is the source
  # the post-run aggregator (scripts/aggregate-debug-report.mjs) reads to build a
  # single ai-debug-report/DEBUG_REPORT.md covering ALL tests from the Sauce run.
  junit:
    enabled: true
    filename: saucectl-report.xml
  # Combined machine-readable summary of all jobs (handy for CI dashboards).
  json:
    enabled: true
    filename: saucectl-report.json

artifacts:
  # Clear the previous download folder before fetching new artifacts.
  cleanup: true
  download:
    when: always
    match:
      - "*"
    directory: ./test-results/sauce
